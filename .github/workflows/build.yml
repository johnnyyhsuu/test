name: Build IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source zip
        run: |
          if [ ! -f project.yml ]; then
            ZIP=$(ls *.zip | head -1)
            unzip -o -q "$ZIP"
          fi
          test -f project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -version
          xcodebuild \
            -project StreakBoxes.xcodeproj \
            -scheme StreakBoxes \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/StreakBoxes.app
          test -d "$APP/PlugIns/StreakWidget.appex"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry StreakBoxes.ipa Payload
          ls -lh StreakBoxes.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreakBoxes-ipa
          path: StreakBoxes.ipa

      - name: Publish release (download link for your iPhone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" StreakBoxes.ipa \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Streak Boxes build ${{ github.run_number }}" \
            --notes "Unsigned IPA. Install with AltStore."
